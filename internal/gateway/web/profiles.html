<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacebase - ユーザー一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="font-bold text-xl tracking-wider">🚀 Spacebase Portal</span>
            <div class="space-x-4">
                <a href="/" class="hover:text-indigo-200 pb-1">ユーザー登録</a>
                <a href="/profiles" class="hover:text-indigo-200 border-b-2 border-white pb-1 font-semibold">ユーザー一覧</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-12 p-8 bg-white rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">ユーザープロファイル一覧</h2>
            <button id="refreshBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-md font-semibold hover:bg-indigo-700 transition">
                更新
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full table-auto border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-left text-sm uppercase font-semibold">
                        <th class="px-6 py-3 border-b">メールアドレス</th>
                        <th class="px-6 py-3 border-b">ステータス</th>
                        <th class="px-6 py-3 border-b">プログラミング言語</th>
                    </tr>
                </thead>
                <tbody id="profilesTableBody" class="text-gray-600 text-sm">
                    <!-- JavaScriptで動的に行を追加 -->
                    <tr id="loadingRow">
                        <td colspan="3" class="px-6 py-4 text-center text-gray-500">データを読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        async function fetchProfiles(showLoading = true) {
            const tbody = document.getElementById('profilesTableBody');
            if (showLoading) {
                tbody.innerHTML = '<tr id="loadingRow"><td colspan="3" class="px-6 py-4 text-center text-gray-500">データを読み込み中...</td></tr>';
            }

            try {
                const response = await fetch('/api/profiles');
                if (!response.ok) {
                    throw new Error(`エラーが発生しました: ${response.statusText}`);
                }
                const profiles = await response.json();
                
                tbody.innerHTML = '';
                if (!profiles || profiles.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">登録されているユーザーはいません。</td></tr>';
                    return;
                }

                profiles.forEach(profile => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-gray-50';

                    const nameTd = document.createElement('td');
                    nameTd.className = 'px-6 py-4 font-medium text-gray-900';
                    nameTd.innerText = profile.email || '';

                    const statusTd = document.createElement('td');
                    statusTd.className = 'px-6 py-4';
                    const statusSpan = document.createElement('span');
                    statusSpan.className = getStatusBadgeClass(profile.status);
                    statusSpan.innerText = profile.status || 'unknown';
                    statusTd.appendChild(statusSpan);

                    const langTd = document.createElement('td');
                    langTd.className = 'px-6 py-4';
                    const languages = profile.languages || [];
                    languages.forEach(lang => {
                        const langSpan = document.createElement('span');
                        langSpan.className = 'inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full mr-1';
                        langSpan.innerText = lang;
                        langTd.appendChild(langSpan);
                    });

                    tr.appendChild(nameTd);
                    tr.appendChild(statusTd);
                    tr.appendChild(langTd);
                    tbody.appendChild(tr);
                });

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">データの読み込みに失敗しました: ${err.message}</td></tr>`;
            }
        }

        function getStatusBadgeClass(status) {
            switch(status ? status.toLowerCase() : '') {
                case 'active':
                    return 'px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800';
                case 'inactive':
                    return 'px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800';
                case 'pending':
                    return 'px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800';
                default:
                    return 'px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800';
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', () => fetchProfiles(true));
        
        // ページロード時にデータ取得
        window.addEventListener('DOMContentLoaded', () => fetchProfiles(true));

        // 【リアルタイム自動同期】60秒ごとにバックグラウンドでデータを自動再取得（リロードなしで反映、バックグラウンド更新時はローディングを非表示にしてチラつきを防止）
        setInterval(() => fetchProfiles(false), 60000);
    </script>
</body>
</html>
