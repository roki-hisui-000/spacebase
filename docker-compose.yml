#version: "3.8"

services:
  valkey:
    image: valkey/valkey:8
    container_name: spacebase-valkey
    ports:
      - "6379:6379"
    restart: always

  processing:
    build:
      context: .
      dockerfile: cmd/processing/Dockerfile
    image: spacebase-processing:latest
    container_name: spacebase-processing
    ports:
      - "50051:50051"
    environment:
      - SPACE_SERVICE_ADDR=middleware:50052
    depends_on:
      - middleware

  middleware:
    build:
      context: .
      dockerfile: middleware/Dockerfile
    image: spacebase-middleware:latest
    container_name: spacebase-middleware
    ports:
      - "8080:8080"
      - "50052:50052"
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - PROCESSING_UNIT_ADDR=processing:50051
    depends_on:
      - valkey

  simulator:
    build:
      context: .
      dockerfile: cmd/simulator/Dockerfile
    image: spacebase-simulator:latest
    container_name: spacebase-simulator
    environment:
      - API_URL=http://middleware:8080/api/dashboard/orders
      - INTERVAL_MS=1000
      - ENABLED=true
    depends_on:
      - middleware
    profiles:
      - simulator-only

