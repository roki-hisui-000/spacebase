<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacebase - ユーザー一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="font-bold text-xl tracking-wider">🚀 Spacebase Portal</span>
            <div class="space-x-4">
                <a href="/" class="hover:text-indigo-200 pb-1">ユーザー登録</a>
                <a href="/profiles" class="hover:text-indigo-200 border-b-2 border-white pb-1 font-semibold">ユーザー一覧</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-12 p-8 bg-white rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">ユーザープロファイル一覧</h2>
            <button id="refreshBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-md font-semibold hover:bg-indigo-700 transition">
                更新
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full table-auto border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-left text-sm uppercase font-semibold">
                        <th class="px-6 py-3 border-b">メールアドレス</th>
                        <th class="px-6 py-3 border-b">ステータス</th>
                        <th class="px-6 py-3 border-b">プログラミング言語</th>
                    </tr>
                </thead>
                <tbody id="profilesTableBody" class="text-gray-600 text-sm">
                    <tr id="loadingRow">
                        <td colspan="3" class="px-6 py-4 text-center text-gray-500">データを読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        async function fetchProfiles(showLoading = true) {
            const tableBody = document.getElementById('profilesTableBody');
            const loadingRow = document.getElementById('loadingRow');

            if (showLoading) {
                loadingRow.style.display = 'table-row';
            }

            try {
                const response = await fetch('/api/profiles');
                const profiles = await response.json();

                tableBody.innerHTML = ''; // 既存の行をクリア

                if (profiles.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">登録ユーザーはいません。</td></tr>`;
                } else {
                    profiles.forEach(profile => {
                        const row = tableBody.insertRow();
                        row.className = "border-b border-gray-200 hover:bg-gray-50";
                        row.insertCell().innerHTML = `<div class="px-6 py-4">${profile.email}</div>`;
                        row.insertCell().innerHTML = `<div class="px-6 py-4">${profile.status}</div>`;
                        row.insertCell().innerHTML = `<div class="px-6 py-4">${profile.languages ? profile.languages.join(', ') : '-'}</div>`;
                    });
                }
            } catch (error) {
                console.error('Error fetching profiles:', error);
                tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">プロファイルの取得に失敗しました。</td></tr>`;
            } finally {
                loadingRow.style.display = 'none';
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', () => fetchProfiles(true));

        // ページロード時にデータ取得
        window.addEventListener('DOMContentLoaded', () => fetchProfiles(true));

        // 自動同期 (1分)
        const AUTO_REFRESH_INTERVAL_MINUTES = 1;
        const AUTO_REFRESH_INTERVAL_MS = AUTO_REFRESH_INTERVAL_MINUTES * 60 * 1000;
        setInterval(() => fetchProfiles(false), AUTO_REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
