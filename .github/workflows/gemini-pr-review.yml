name: Gemini AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

# 同じPRで連続プッシュがあった場合、古いレビューを自動でキャンセルしてAPI料金とActions枠を節約
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 差分（diff）を正確に取得するために全履歴を取得

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR Diff
        run: |
          # developブランチからの差分を取得
          git diff origin/develop...HEAD > diff.txt

      - name: Run Gemini Review Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node .github/scripts/review.js

      - name: Post Review Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f review_result.txt ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file review_result.txt
          fi
